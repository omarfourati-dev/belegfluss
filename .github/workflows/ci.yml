name: CI

# Runs on GitHub-hosted runners only. Pull requests (also from forks) never reach the self-hosted runner.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend – install, test, type-check and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers starts a real PostgreSQL via the runner's Docker daemon.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t belegfluss:ci .
